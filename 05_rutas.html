<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas</title>
</head>
<body>
    <h1>Explicación: Rutas Absolutas y relativas</h1>

    <section>
        <h2>Rutas Absolutas</h2>
        <!-- Ruta completa a un recurso en un servidor externo. La ruta absoluta es la URL completa del recurso, esta no se modifica según la ubicación del archivo actual -->
         <p>
            para ir a un sitio externo, como el catalogo global de respuestos,
            usamos la URL completa:
            <a href="https://www.catalogo-global.com/">Catalogo Global</a>
         </p>

         <img src="https://www.manuelweb.net/img/covers/htm15-cover.jpg" alt="Imagen HTML desde un servidor externo" width="300" height="200" tittle="HTML 5">
    </section>

    <hr>

    <selection>
        <h2>Rutas Relativas</h2>
        <!-- Ruta relativa a un recurso en el mismo servidor. La ruta relativa se calcula en relación con la ubicación del archivo actual -->

        <p>
            Ir a la pagina de <a href="04_inline_inblock.html">Inline y Block</a>
            <!-- Funciona si hay un archivo llamado 04_inline_inblock.html en la misma carpeta. -->
        </p>

        <p>
            ver foto de tecnologia <a href="img/imagen_css.png">CSS 3</a>
            <!-- Funciona si hay un archivo llamado imagen_css.png en la carpeta img -->
        </p>

        <p>
            Ver foto de tecnologia <a href="img/imagen_css.png">CSS 3</a>
             <!-- Funciona si hay un archivo llamado imagen_css.png en la carpeta img. -->
        </p>
    </selection>
</body>
</html>
