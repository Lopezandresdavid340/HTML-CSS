<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
    <!-- Los enlaces o anclas o hiperviculos -->
    <!-- a (anchor) significa ancla. Metafora: como en un barco te mantiene en una ubicacion especifica un ancla es justamente para que el usuario sepa hacia donde navegar en la pagina web. -->
    
    <!-- Los atributos son caracteristicas que definen el comportamiento y la apariencia de los elementos en este caso el atributo href es la referiencia al recurso al que apunta el enlace.-->
     <h2 tittle="titulo de la pagina">Enlaces o nclas</h2>
     <!-- Por otra parte, el atributo title proporciona un texto de ayusa que se muestra cuando el usuario pasa el mouse sobre el enlace. Las tecnologias de asistencia como lectores de pantalla utilizan este atributo para proporcionar informacion adicional al usuario. En el caso de personas invidentes esto les permite acceder a informacion adicional sobre el enlace. -->
        
     <a href="https://www.google.com">Google</a>
     <br>
        <a href="https://www.facebook.com">Facebook</a>
    <br>
        <a href="https://www.youtube.com">Youtube</a>
    <br>   
    <a tittle="ir al canal de yotube" href="//youtube.com/@ramcrack0584">Ramcrack</a> <!-- Mala practica: usar protocolo relativo sin especificar el protocolo -->
    <br>
    <br>
    <a href="03-1_ pagina_enlace1.html"> Ir a enlace uno</a>
    <br>
    <a href="03-2_pagina_enlace2.html"> Ir a enlace dos</a>
    <br>
    <a href="03-3_pagina_enlace3.html"> Ir a enlace tres</a>
    <!-- Es sumamente importante que en la programacion y el desarrollo web se realicen las practicas a medida que se va avanzando, de esta forma se asegura una mejor compresion y alicacion de los conceptos aprendidos. Entiendan que la programcion es un proceso activo no pasivo, una cosa es intentar comprender lo que sucede cuando leen o ven algo que se esta haciendo, sin embargo, la unica forma de aprender es probando ustedes mismos todo lo que se debe implementar.-->
     <br>
     <h2>Enlaces con target a otra ventana </h2>
     <a href="03_4_pagina_enlace4.html" target="_blank">Ir a enlace cuatro en una nueva ventana</a>
     <!-- El atributo target="_blank" abre el enlace en una nueva pestaña o ventana del navegador. Por defecto siempre esta en self que significa que se abre en la misma ventana -->

        



</body>
</html>
