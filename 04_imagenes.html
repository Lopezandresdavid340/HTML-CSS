    <!-- Etiquetas de bloque y Etiquetas de Linea  --> 
     <h1>Imagenes</h1>
     <!-- Las imagenes se insertan en HTML utilizando la etiqueta img. Esta etiqueta es un elemento vacio, lo que significa que no tiene una etiqueta de cierre. La sintaxis basica para insertar una imagen es:-->

     <!-- Vale la pena recordar que el atributo title proporciona un tooltip que se muestra cuando el usuario pasa el mouse sobre la imagen -->
      <img src="04_imagenes.png" alt="Logotipo de HTML5" width="200" height="200">
      <!-- Para que los lectores de  pantalla puedan saber de que trata la imagen el atributo alt (alternative text) es muy importante puesto que proporciona una descripcion textual de la imagen para accesibilidad y como fallback si no se carga. El texto alternativo debe ser descriptivo y conciso, y debe transmitir la informacion esencial que la imagen representa. por ejemplo, si la imagen es un logotipo de una empresa, el texto alternativo podria ser "Logotipo de la empresa XYZ". Si la imagen es una fotografia de un paisaje, el texto alternativo podria ser "Paisaje natural". En resumen, el atributo alt proporciona una descripcion textual de la imagen para accesibilidad y como fallback si no se carga. -->

      <!-- Self closing Tags son etiquetas que se autocierren -->
       
    
</body>
</html>
