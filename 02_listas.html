<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!-- Listas ordenadas (Order List) y Listas no ordenadas (Unordered List) -->
     <!-- Listas ordenadas: Se utlizan para enumerar elementos en un orden especifico, como pasos en un proceso o una lista de tareas. -->

     <ol>
        <!-- La lista ordenada se puede crear para escribir una lista de pasos a seguir, por ejemplo: la preparacion de un jugo. 1. Lavar, picar frutas; 2. vertir agua en la licuadora 3. agregar los ingredientes (azucar, especias, entre otras); 4. licuar; 5. Servir.-->
         <li>Primer elemento</li>
         <li>Segundo elemento</li>
         <li>Tercer elemento</li>

     </ol>
     <ol type="A">
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
     </ol>

     <ol type="I">
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
     </ol>

     <ol type="a">
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
     </ol>

     <ol start="5">
        <li>cinco</li>
        <li>seis</li>
        <li>Siete</li>
        </ol>

        <ol start="5" reversed>
        <li>cinco</li>
        <li>Cuatro</li>   
        <li>Tres</li>
        </ol>

     <!-- Listas no ordenadas: Se utilizan para enumerar elementos sin un orden específico, como una lista de compras o una lista de características. -->
     <ul>
        <!-- La lista no ordenada se puede crear para escribir una lista de ingredientes, por ejemplo: para preparar un jugo. -->
            <li>Frutas</li>
            <li>Agua</li>
            <li>Azucar</li>
            <li>Especias</li>
     </ul>

     <ul>

     </ul>

</body>
</html>
